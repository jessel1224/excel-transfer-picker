<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轉出狀況背景模式</title><link rel="stylesheet" href="style.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script src="picker.js"></script><script src="background-v3.js" defer></script></head><body><main><h1>轉出狀況 · 背景模式</h1><p>啟用後會收起此面板。背景程式繼續運作，點 ICU、RCC、WARD 的 O 欄第 5 列起，即可開啟選擇框。</p><p id="status" role="status" aria-live="polite">正在啟用…</p><button id="enable" class="primary">啟用並收起面板</button><button id="open" class="secondary">重新開啟目前儲存格的選擇框</button><button id="stop" class="secondary">停用自動跳框</button><p>這是設定面板，不需要常駐。首次安裝時可能短暫出現；支援背景模式時會自動收起。停用後可手動編輯原格。相同格再點一次不會觸發選取變更，可換格再點回來。</p></main></body></html>
