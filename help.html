<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>背景模式說明</title><link rel="stylesheet" href="style.css"><main><h1>背景模式 v3</h1><p>首次啟用後設定面板自動收起，點 ICU、RCC、WARD 的 O 欄第 5 列起即可開啟選擇框。共用執行階段在面板關閉後持續運作。</p><p>常用頁籤的「轉出狀況」群組提供啟用、停用、重開選擇框、查看設定。每份新活頁簿需先手動啟用一次；重新開啟自動載入需在實際環境驗收。相同格再點一次不會觸發選取變更。唯讀/受保護格不可寫入。</p><p>若無法自動跳框，查看設定中的錯誤結果；本工具不會自動解除保護。共同編輯請避免同時修改同一格。</p></main>
