<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>使用說明</title><link rel="stylesheet" href="style.css"><main><h1>轉出狀況大字選擇</h1><p>請在 Excel 中開啟此增益集側邊欄，再點 ICU、RCC、WARD 的 O 欄第 5 列起。點選大字選項後會填回數字代碼。</p><p>若自動選擇框未開啟，請按側邊欄的開啟按鈕。原檔工作表有保護；若無法寫入，請洽原管理者確認該格可編輯。詳細安裝方式見隨附 README.md。</p></main></html>
