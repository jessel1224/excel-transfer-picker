<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大字選擇框示範</title><link rel="stylesheet" href="style.css"><script src="picker.js"></script></head><body><main><h1>轉出狀況選擇框</h1><p>背景模式 v3 · 此頁僅為示範，不連接 Excel</p><p>示範儲存格 O5：<strong id="value">空白</strong></p><button class="primary" id="open">點我，模擬點選 O5</button><dialog id="modal" style="width:min(760px,85vw);max-height:85vh;border:0;border-radius:18px"><h1>選擇轉出狀況</h1><p>示範位置：ICU!O5</p><div id="options"></div><button id="cancel" class="secondary">取消</button></dialog></main><script>const modal=document.getElementById('modal');document.getElementById('open').onclick=()=>modal.showModal();document.getElementById('cancel').onclick=()=>modal.close();Picker.options.forEach((text,i)=>{const b=document.createElement('button');b.className='option';b.textContent=(i+1)+'　'+text;b.onclick=()=>{document.getElementById('value').textContent=text;modal.close();};document.getElementById('options').append(b);});</script></body></html>
